
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kelime Kaşifleri</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10152d;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:12px;background:#202b50;display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px}
h1{color:#ffe477;margin:12px}
#scene{position:relative;max-width:1000px;margin:auto}
canvas{display:block;width:100%;height:65vh;min-height:300px;max-height:650px;background:#182e51;border:3px solid #6076ae;touch-action:none}
#menu{position:absolute;inset:0;background:#10152ded;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#menu h2{font-size:clamp(28px,5vw,48px);color:#73efff}
button{border:0;border-radius:12px;padding:13px 20px;margin:5px;background:#7759ff;color:white;font-size:17px;font-weight:bold;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
#controls{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:12px}
#question{background:#202b50;margin:10px auto;padding:18px;max-width:800px;border-radius:16px}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#answers button{background:#30436e}
#feedback{min-height:30px;color:#a5f3c5}
#next{display:none;background:#16a477}
@media(max-width:500px){canvas{height:52vh;min-height:280px}#answers{grid-template-columns:1fr}button{padding:12px;font-size:15px}}
</style>
</head>
<body>
<header>
  <b>⭐ Puan: <span id="score">0</span></b>
  <b>💎 Kristal: <span id="gems">0</span></b>
  <b>📚 Bölüm: <span id="level">1</span>/6</b>
</header>
<h1>🧭 KELİME KAŞİFLERİ</h1>

<div id="scene">
<canvas id="game"></canvas>
<div id="menu">
  <div style="font-size:65px">🗺️✨</div>
  <h2>Kelime Kaşifleri</h2>
  <p>Kristalleri topla, engelleri aş ve Türkçe sorularını çözerek gizemli kapıları aç!</p>
  <button id="start">MACERAYA BAŞLA ▶</button>
</div>
</div>

<div id="controls">
  <button id="left">◀ SOL</button>
  <button id="jump">⬆ ZIPLA</button>
  <button id="right">SAĞ ▶</button>
  <button id="use">🚪 KAPI</button>
  <button id="pause">Ⅱ DURAKLAT</button>
</div>

<div id="question" hidden>
  <h2 id="qtitle">Kapı bulmacası</h2>
  <p id="qtext"></p>
  <div id="answers"></div>
  <p id="feedback"></p>
  <button id="next">Devam et ➜</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

const questions=[
 {title:"🌿 Anlam Ormanı",q:"“Özenli” kelimesinin anlamı nedir?",
 a:["Dikkatli ve itinalı","Çok hızlı","Kararsız","Gürültülü"],c:0,
 e:"Özenli, bir işi dikkat ederek ve gereken önemi vererek yapan demektir."},
 {title:"💎 Deyim Mağarası",q:"“Etekleri zil çalmak” ne demektir?",
 a:["Korkmak","Çok sevinmek","Yorulmak","Sinirlenmek"],c:1,
 e:"Bu deyim, çok sevinmek anlamında kullanılır."},
 {title:"🌱 Fiil Vadisi",q:"Hangisinde iş (kılış) fiili vardır?",
 a:["Bebek uyudu.","Hava soğudu.","Defteri çantasına koydu.","Çiçek sarardı."],c:2,
 e:"Koymak fiili bir nesne üzerinde yapılan işi anlatır."},
 {title:"🏰 Cümle Kalesi",q:"“Yağmur yağdığı için maç ertelendi.” cümlesinde hangi ilişki var?",
 a:["Amaç-sonuç","Neden-sonuç","Koşul-sonuç","Karşılaştırma"],c:1,
 e:"Maçın ertelenme nedeni yağmurun yağmasıdır."},
 {title:"⚓ Noktalama Limanı",q:"“Eyvah___ otobüsü kaçırdım!” boşluğa ne gelir?",
 a:["Virgül","Ünlem","İki nokta","Noktalı virgül"],c:1,
 e:"Eyvah gibi duygu bildiren sözlerden sonra ünlem kullanılabilir."},
 {title:"🏔️ Paragraf Zirvesi",q:"Paragrafta asıl anlatılmak istenen düşünce nedir?",
 a:["Örnek","Başlık","Ana fikir","Yardımcı fikir"],c:2,
 e:"Ana fikir, yazarın okuyucuya asıl anlatmak istediği düşüncedir."}
];

let W=900,H=450;
let player={x:70,y:0,w:32,h:42,vy:0};
let platforms=[],gems=[],hazards=[];
let keys={},score=0,gemCount=0,level=0;
let playing=false,paused=false,questionOpen=false,answered=false,gateOpen=false;
let camera=0,ground=0,last=0;

function resize(){
 const r=canvas.getBoundingClientRect();
 W=r.width;H=r.height;
 canvas.width=Math.round(W*devicePixelRatio);
 canvas.height=Math.round(H*devicePixelRatio);
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 makeWorld();draw();
}
function makeWorld(){
 ground=H-55;
 platforms=[{x:0,y:ground,w:1800,h:100}];
 for(let i=0;i<7;i++)
   platforms.push({x:210+i*205,y:ground-75-(i%3)*22,w:100,h:15});
 gems=[];
 for(let i=0;i<18;i++)
   gems.push({x:130+i*90,y:ground-40-(i%3)*32,taken:false});
 hazards=[];
 for(let i=0;i<5;i++)
   hazards.push({x:350+i*260,y:ground-23,w:30,h:23});
 player.x=60;player.y=ground-player.h;player.vy=0;
 camera=0;gateOpen=false;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#15284b");g.addColorStop(1,"#4396a1");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.save();ctx.translate(-camera,0);
 // Dekoratif yıldızlar
 for(let i=0;i<50;i++){
   let x=(i*137)%(W+900);
   let y=(i*71)%(ground-40);
   ctx.fillStyle="#ffffff88";ctx.fillRect(x,y,2,2);
 }
 // Zemin ve platformlar
 platforms.forEach(p=>{
   ctx.fillStyle="#255a53";ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.fillStyle="#78edb5";ctx.fillRect(p.x,p.y,p.w,4);
 });
 // Kristaller
 gems.forEach(c=>{
   if(c.taken)return;
   ctx.save();ctx.translate(c.x,c.y+Math.sin(Date.now()/220+c.x)*4);
   ctx.rotate(Math.PI/4);ctx.fillStyle="#68f4ff";
   ctx.shadowColor="#68f4ff";ctx.shadowBlur=12;
   ctx.fillRect(-8,-8,16,16);ctx.restore();
 });
 // Dikenler
 hazards.forEach(h=>{
   ctx.fillStyle="#ff779e";ctx.beginPath();
   ctx.moveTo(h.x,h.y+h.h);ctx.lineTo(h.x+15,h.y);ctx.lineTo(h.x+h.w,h.y+h.h);ctx.fill();
 });
 // Kapı
 ctx.fillStyle=gateOpen?"#57edb2":"#7958ff";
 ctx.fillRect(1690,ground-90,55,90);
 ctx.fillStyle="#fff";ctx.font="bold 13px Arial";
 ctx.fillText(gateOpen?"AÇIK":"KAPI",1692,ground-98);
 // Karakter
 ctx.fillStyle="#20254c";ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.fillStyle="#68efff";ctx.fillRect(player.x+5,player.y+5,player.w-10,player.h-14);
 ctx.fillStyle="#172c4d";ctx.fillRect(player.x+11,player.y+12,12,8);
 ctx.fillStyle="#242746";ctx.fillRect(player.x+2,player.y+player.h-5,12,8);
 ctx.fillRect(player.x+19,player.y+player.h-5,12,8);
 ctx.restore();
}
function update(t){
 const dt=Math.min((t-last)/1000||0,.035);last=t;
 if(playing&&!paused&&!questionOpen){
   let dir=(keys.right?1:0)-(keys.left?1:0);
   player.x+=dir*250*dt;
   player.x=Math.max(0,Math.min(1740,player.x));
   player.vy+=1250*dt;
   player.y+=player.vy*dt;
   let onGround=false;
   for(const p of platforms){
     if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&
        player.y+player.h>=p.y&&player.y+player.h-player.vy*dt<=p.y){
       player.y=p.y-player.h;player.vy=0;onGround=true;
     }
   }
   if(player.y>H+100){player.y=ground-player.h;player.vy=0;player.x=Math.max(0,player.x-80);}
   gems.forEach(c=>{
     if(!c.taken&&Math.abs(player.x+player.w/2-c.x)<23&&Math.abs(player.y+player.h/2-c.y)<30){
       c.taken=true;gemCount++;score+=20;updateHud();
     }
   });
   hazards.forEach(h=>{
     if(player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y){
       player.x=Math.max(0,player.x-90);player.vy=-250;score=Math.max(0,score-10);updateHud();
     }
   });
   camera=Math.max(0,Math.min(1745-W,player.x-W*.32));
 }
 draw();requestAnimationFrame(update);
}
function updateHud(){
 $("score").textContent=score;
 $("gems").textContent=gemCount;
 $("level").textContent=Math.min(level+1,6);
}
function jump(){if(playing&&!paused&&!questionOpen&&player.y+player.h>=ground-2)player.vy=-520;}
function interact(){
 if(!playing||paused||questionOpen)return;
 if(player.x>1550){
   if(gateOpen){level++;
     if(level>=questions.length){
       alert("Tebrikler! Türkçe Ustası oldun! Puanın: "+score);
       level=0;score=0;gemCount=0;
     }
     makeWorld();updateHud();
   }else showQuestion();
 }
}
function showQuestion(){
 questionOpen=true;answered=false;
 const q=questions[level];
 $("qtitle").textContent=q.title;
 $("qtext").textContent=q.q;
 $("feedback").textContent="Doğru cevabı seçerek kapıyı aç!";
 $("answers").innerHTML="";
 $("next").style.display="none";
 q.a.forEach((answer,i)=>{
   const b=document.createElement("button");
   b.textContent=String.fromCharCode(65+i)+") "+answer;
   b.onclick=()=>answerQuestion(i,b);
   $("answers").appendChild(b);
 });
 $("question").hidden=false;
}
function answerQuestion(i,button){
 if(answered)return;
 answered=true;
 const q=questions[level];
 [...$("answers").children].forEach((b,j)=>{
   b.disabled=true;
   if(j===q.c)b.style.background="#167c5c";
 });
 if(i===q.c){
   score+=100;gateOpen=true;
   $("feedback").textContent="✨ Doğru! "+q.e;
 }else{
   button.style.background="#a23858";
   $("feedback").textContent="Bu kez olmadı. "+q.e;
 }
 updateHud();$("next").style.display="inline-block";
 $("next").textContent=i===q.c?"Kapıdan geç ➜":"Tekrar dene";
}
$("next").onclick=()=>{
 $("question").hidden=true;questionOpen=false;
 if(gateOpen)player.x=1600;
 else showQuestion();
};
$("start").onclick=()=>{
 $("menu").style.display="none";playing=true;paused=false;
 makeWorld();last=performance.now();
};
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶ DEVAM":"Ⅱ DURAKLAT";};
$("left").onpointerdown=e=>{e.preventDefault();keys.left=true};
$("right").onpointerdown=e=>{e.preventDefault();keys.right=true};
["left","right"].forEach(id=>{
 $(id).onpointerup=()=>keys[id==="left"?"left":"right"]=false;
 $(id).onpointerleave=()=>keys[id==="left"?"left":"right"]=false;
 $(id).onpointercancel=()=>keys[id==="left"?"left":"right"]=false;
});
$("jump").onpointerdown=e=>{e.preventDefault();jump()};
$("use").onclick=interact;
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=true;
 if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W")jump();
 if(e.key==="e"||e.key==="E"||e.key==="Enter")interact();
});
window.addEventListener("keyup",e=>{
 if(["ArrowLeft","a","A"].includes(e.key))keys.left=false;
 if(["ArrowRight","d","D"].includes(e.key))keys.right=false;
});
window.addEventListener("resize",resize);
resize();requestAnimationFrame(update);
</script>
</body>
</html>
